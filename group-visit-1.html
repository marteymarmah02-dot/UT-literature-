.stats b{display:block;font-size:17px;color:var(--t);overflow-wrap:anywhere}
label{display:block;font-size:13px;color:var(--m);margin:10px 0 0}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;margin-top:4px;font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:12px}
input[type=checkbox]{width:24px;height:24px;min-height:0;margin:0}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--t);min-height:48px}
button,.btn{min-height:48px;padding:10px 16px;font:600 15px system-ui;border:0;border-radius:14px;background:var(--a);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin:4px 4px 0 0}
.b2{background:var(--s);color:var(--a);border:1px solid var(--b)}.bd{background:#a64b45}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.chips button{flex:none;margin:0;background:var(--c);color:var(--t);border:1px solid var(--b)}
.chips .on{background:var(--a);color:#fff}
.tw{overflow-x:auto}table{border-collapse:collapse;min-width:900px;width:100%}
td,th{padding:4px;text-align:left;font-size:13px;vertical-align:top}td input,td select{margin:0;min-height:44px;min-width:90px}
td button{min-height:40px;padding:6px 10px;font-size:13px}
.prev{white-space:pre-wrap;background:var(--s);border-radius:16px;padding:16px;border:1px dashed var(--a)}
.lock{opacity:.5;pointer-events:none}.warn{background:var(--s);padding:10px;border-radius:12px;font-size:14px}
.ref{display:block;color:var(--t);text-decoration:none;font-weight:600}.ref small{color:var(--m);font-weight:400}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--m);flex-direction:column;font-size:10.5px;min-height:58px;padding:6px 0}
nav button span{font-size:21px}nav .on{color:var(--a);background:var(--s)}

:focus-visible{outline:3px solid var(--g);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const next=()=>S.groups.filter(g=>g.dt&&!g.done&&g.dt>=today()).sort((a,b)=>a.dt.localeCompare(b.dt))[0];
const chips=()=>`<div class="chips">${S.groups.map((g,i)=>`<button data-cur="${i}" class="${i==S.cur?'on':''}">${esc(g.n)}</button>`).join('')}</div>`;
const invDefault=()=>[T('We are very happy to inform you that we will soon be visiting your group.'),T('Our desire is simply to spend time together, encourage one another, and strengthen our appreciation for Jehovah and the wonderful privilege of serving him.'),T('One week before the visit, we would also like to meet with you and your assistant. During this meeting, we will briefly go through the publishers’ records together. This will help us identify areas where individual publishers may need encouragement, commendation, or practical assistance to make further progress in their ministry.'),T('Our goal is not simply to review records, but to understand how we can better support the brothers and sisters, recognize their good efforts, and help each one continue to grow spiritually. We are really looking forward to working together with you and sharing this encouraging time with the group.'),T('Thank you for your loving cooperation and for the work you are doing to care for the brothers and sisters.')].join('\n\n');
const invText=g=>`${T('Dear brothers and sisters,')}\n\n${g.iv.trim()||invDefault()}\n\n📖 ${T('Theme')}: ${g.th||'—'}\n📅 ${T('Date')}: ${fmt(g.dt)}\n⏰ ${T('Time')}: ${g.tm||'—'}\n\n${T('With Christian love,')}\n${g.el||'—'}`;
const piText=()=>{const p=S.pi,L=[];L.push(T('Dear brothers and sisters,'),'',p.ms,'');
if(p.ti)L.push('📖 '+T('Title')+': '+p.ti);if(p.th)L.push('💡 '+T('Theme')+': '+p.th);if(p.sp)L.push('🎤 '+T('Speaker')+': '+p.sp);if(p.dt)L.push('📅 '+T('Date')+': '+fmt(p.dt));if(p.tm)L.push('⏰ '+T('Time')+': '+p.tm);if(p.lo)L.push('📍 '+T('Location')+': '+p.lo);
L.push('',T('With Christian love,'),p.el||'—');return L.join('\n')};
const stats=()=>{const n=next();return `<div><b>6</b>Groups</div><div><b>${n?esc(n.n):'—'}</b>Next Visit${n?'<br>'+n.dt:''}</div><div><b>${S.groups.filter(g=>g.done).length}</b>Visits Completed</div><div><b>${S.groups.filter(g=>g.fc[4]).length}</b>Follow-Ups</div><div><b>${S.inv}</b>Invitations Prepared</div><div><b>❤️</b>1 Thess. 5:11</div>`};
function toast(m){const t=$('#toast');t.textContent=T(m);t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',1800)}
function copy(x){const d=()=>toast('Copied');navigator.clipboard?.writeText(x).then(d,fb)||fb();function fb(){const a=document.createElement('textarea');a.value=x;document.body.append(a);a.select();try{document.execCommand('copy');d()}catch(e){}a.remove()}}
const wa=x=>window.open('https://wa.me/?text='+encodeURIComponent(x),'_blank');
const sig=x=>navigator.share?navigator.share({text:x}).catch(()=>{}):(copy(x),toast('Copied — paste into Signal'));
const bump=()=>{S.inv++;save()};
function good(){const g=cg();return `<div class="card"><h3>Notice the Good</h3><p class="q">Look for the good before discussing the difficulty.</p>${['One spiritual strength','One act of faithfulness','One quality observed','One thing to encourage','One practical way the elders can help'].map((l,i)=>ta(l,gp('g.'+i),2)).join('')}</div>`}
function follow(){const g=cg(),ok=g.g.every(x=>x.trim());return `<div class="card"><h3>After the Visit</h3>${ok?'':'<div class="warn">Record all five good things above first. Follow-up unlocks once the encouragement is written down.</div>'}<div class="${ok?'':'lock'}">${['Encouragement given','Spiritual goal discussed','Practical help identified','Publisher encouraged','Follow-up needed'].map((l,i)=>`<label class="chk"><input type="checkbox" data-fc="${i}" ${g.fc[i]?'checked':''}>${l}</label>`).join('')}${f('Follow-up date',gp('fd'),'date')}${ta('Follow-up notes',gp('fn'),3)}</div></div>`}
function table(){return `<div class="card"><h3>Group Visit Table</h3><div class="tw"><table><tr><th>Group<th>Month<th>Day<th>Date<th>Time<th>Theme<th>Status<th></tr>${S.groups.map((g,i)=>{const P=k=>`groups.${i}.${k}`,v=k=>esc(g[k]);return `<tr><td><input aria-label="Group name" data-p="${P('n')}" value="${v('n')}"><td><input aria-label="Month" list="mo" data-p="${P('mo')}" value="${v('mo')}"><td><input aria-label="Day" list="dy" data-p="${P('dy')}" value="${v('dy')}"><td><input aria-label="Date" type="date" data-p="${P('dt')}" value="${v('dt')}"><td><input aria-label="Time" type="time" data-p="${P('tm')}" value="${v('tm')}"><td><input aria-label="Theme" data-p="${P('th')}" value="${v('th')}"><td><input aria-label="Status" list="st" data-p="${P('st')}" value="${v('st')}"><td><button class="b2" data-a="edit" data-i="${i}">Edit</button><button data-a="tsave" data-i="${i}">Save</button><button class="bd" data-a="del" data-i="${i}">Delete</button><button class="b2" data-a="cpy" data-i="${i}">Copy Invitation</button></tr>`}).join('')}</table></div></div>
<datalist id="mo">${MO.map(m=>`<option>${m}`).join('')}</datalist><datalist id="dy">${DY.map(m=>`<option>${m}`).join('')}</datalist><datalist id="st"><option>Scheduled<option>Completed<option>Postponed</datalist>`}
const V={
home(){const g=cg(),n=next();let r='';if(n){const d=daysTo(n.dt);if(n.rm.some(x=>d<=x))r=`<div class="card warn">🔔 ${T('Reminder')}: ${esc(n.n)} — ${d?d+' '+T('day(s)'):T('today')}</div>`}
const row=(l,v)=>`<div><small>${l}</small> <b>${esc(v||'—')}</b></div>`;
return `<div id="stats" class="stats">${stats()}</div>${r}
<div class="card pur"><h3>❤️ Purpose of the Visit</h3><p class="q">“Your work for Jehovah is noticed. Your faithfulness matters.”</p><p>We are not coming to inspect you. We are coming because we value you.</p></div>
<div class="card"><h3>📅 Next Group Visit</h3>${n?row('Group',n.n)+row('Month',n.mo)+row('Day',n.dy)+row('Date',fmt(n.dt))+row('Time',n.tm)+row('Visiting elders',n.el)+row('Status',n.st):'<p>No upcoming visit yet. Open Schedule to set one.</p><button data-go="sched">Schedule a visit</button>'}</div>
${chips()}<div class="card"><h3>👥 ${esc(g.n)}</h3><p><b>📖 ${esc(g.th||'Choose a theme')}</b></p>${ta('📝 Visit Notes',gp('nt'),4)}
<button data-a="wa" data-i="${S.cur}">📨 Send Invitation</button><button class="b2" data-a="cpy" data-i="${S.cur}">Copy</button>
<label class="chk"><input type="checkbox" data-done ${g.done?'checked':''}>✅ Visit Completed</label></div>`},
sched(){const g=cg();return `<div class="card"><h3>Schedule a Visit</h3><label>Group<select id="gsel">${S.groups.map((x,i)=>`<option value="${i}"${i==S.cur?' selected':''}>${esc(x.n)}</option>`).join('')}</select></label>${sel('Month',gp('mo'),MO)}${sel('Day',gp('dy'),DY)}${f('Date',gp('dt'),'date')}${f('Time',gp('tm'),'time')}${f('Visiting elders',gp('el'),'text','placeholder="Names of visiting elders"')}${f('Theme (choose or write your own)',gp('th'),'text','list="tl"')}<datalist id="tl">${S.themes.map(t=>`<option>${esc(t.t)}`).join('')}</datalist>
<label>Reminders</label>${[[1,'1 day before'],[3,'3 days before'],[7,'1 week before']].map(([d,l])=>`<label class="chk"><input type="checkbox" data-rm="${d}" ${g.rm.includes(d)?'checked':''}>${l}</label>`).join('')}<button data-a="sched">SAVE SCHEDULE</button></div>
<h3>Scheduled Visits</h3>${S.groups.map((x,i)=>x.dt||x.tm?`<div class="card"><b>${esc(x.n)}</b> — ${esc(x.st)}<br>${fmt(x.dt)} ${esc(x.tm)}<br><small>${esc(x.th)} · ${esc(x.el)}</small><br><button class="b2" data-a="edit" data-i="${i}">Edit</button><button class="bd" data-a="del" data-i="${i}">Delete</button></div>`:'').join('')||'<p>Nothing scheduled yet. Fill in the form above and save.</p>'}`},
groups(){const g=cg();return `${chips()}<div class="card"><h3>${esc(g.n)}</h3>${f('Group name',gp('n'))}${sel('Month',gp('mo'),MO)}${sel('Day',gp('dy'),DY)}${f('Date',gp('dt'),'date')}${f('Time',gp('tm'),'time')}${f('Visiting elders',gp('el'))}${f('Theme',gp('th'),'text','list="tl"')}<datalist id="tl">${S.themes.map(t=>`<option>${esc(t.t)}`).join('')}</datalist>${ta('Public-talk invitation wording (blank = default)',gp('iv'),4,1)}${ta('Notes',gp('nt'),3)}${ta('Follow-up points',gp('fp'),3)}</div>${good()}${follow()}${table()}`},
enc(){return `<div class="card pur"><h2>We are not coming to inspect you. We are coming because we value you.</h2><p>We want each publisher to feel that Jehovah sees his or her efforts. Even when someone feels that what they are doing is small, Jehovah values loyal service.</p></div>
<div class="card">${['We love you.','We appreciate you.','Jehovah sees your efforts.','You are valuable to the congregation.','We want to help you keep going.','Your faithful service matters.'].map(x=>`<p class="q">${x}</p>`).join('')}</div><h3>Scriptures</h3>${S.scr.map((s,i)=>`<details class="card"><summary>${esc(s[0])}</summary><p>${esc(s[1])}</p>${f('Reference','scr.'+i+'.0')}${ta('Thought','scr.'+i+'.1',2)}</details>`).join('')}
<h3>Six Encouragement Themes</h3>${S.themes.map((t,i)=>`<details class="card"><summary>${T('Group')} ${i+1}: ${esc(t.t)}</summary>${f('Theme','themes.'+i+'.t')}${f('Key scriptures','themes.'+i+'.s')}${ta('Key / heart thought','themes.'+i+'.k',2)}${ta('Illustration','themes.'+i+'.i',3)}${ta('Heart question','themes.'+i+'.q',2)}<button class="b2" data-a="use" data-i="${i}">Use for this group</button></details>`).join('')}
<details class="card"><summary>Conversation Guide: Start with Appreciation</summary>${ta('Suggested questions (one per line)','conv',8)}</details>
<h3>JW.org Reference Library</h3>${S.links.map(l=>`<a class="card ref" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}<br><small>Opens jw.org in a new tab</small></a>`).join('')}`},
inv(){return `<div class="card"><h3>Public Talk Invitation</h3>${f('Title','pi.ti')}${f('Theme','pi.th')}${f('Speaker','pi.sp')}${f('Date','pi.dt','date')}${f('Time','pi.tm','time')}${f('Location','pi.lo')}${f('Signed by (elders)','pi.el')}${ta('Special invitation message','pi.ms',6,1)}<button data-a="gen">GENERATE INVITATION</button></div><div class="prev" id="prev" contenteditable="true" role="textbox" aria-label="Invitation preview (editable)">${esc(piText())}</div><p><button class="b2" data-a="pcopy">COPY</button><button data-a="pwa">SHARE TO WHATSAPP</button><button data-a="psig">SHARE TO SIGNAL</button><button class="b2" data-a="gtr">TRANSLATE TO GOOGLE TRANSLATE</button></p>`},
set(){return `<div class="card"><h3>Settings</h3><label>Language<select data-lang><option value="en">English</option><option value="ga">Ga</option></select></label><button class="b2" data-a="gts">TRANSLATE TO GOOGLE TRANSLATE</button>${sel('Appearance (— = automatic)','mode',['light','dark'])}<button data-a="exp">EXPORT DATA</button><button class="b2" data-a="imp">IMPORT DATA</button><button class="bd" data-a="reset">RESET APP</button></div><div class="card"><h3>JW.org Links</h3>${S.links.map((l,i)=>f('Label','links.'+i+'.0')+f('Link','links.'+i+'.1','url')).join('')}</div><details class="card"><summary>Ga translations</summary><div data-notr>${Object.keys(GA).map(k=>`<label>${esc(k)}<input data-en="${esc(k)}" placeholder="English" value="${esc(S.en[k]||'')}"><input data-ga="${esc(k)}" placeholder="Ga" value="${esc(S.ga[k]||GA[k])}"></label>`).join('')}</div></details><p class="warn">All data stays on this device. Export a backup regularly.</p>`}};
const mode=()=>document.documentElement.dataset.m=S.mode||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function render(){$('#main').innerHTML=V[S.tab]();$('#nav').innerHTML=TABS.map(t=>`<button data-go="${t[0]}" class="${t[0]==S.tab?'on':''}" aria-label="${t[2]}"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#sub').textContent=T('Encourage • Build Up • Strengthen');document.querySelectorAll('[data-lang]').forEach(x=>x.value=S.lang);tr($('#main'));tr($('#nav'));mode()}
const go=t=>{S.tab=t;save();render();scrollTo(0,0)};
const A={
wa:i=>{wa(invText(S.groups[i]));bump();render()},
cpy:i=>{copy(invText(S.groups[i]));bump();render()},
edit:i=>{S.cur=i;S.tab=S.tab=='sched'?'sched':'groups';render();scrollTo(0,0)},
tsave:i=>{save();toast('Saved')},
sched:()=>{cg().st=cg().done?'Completed':'Scheduled';save();toast('Schedule saved');render()},
del:i=>{if(!confirm(T('Delete this scheduled visit?')))return;Object.assign(S.groups[i],{mo:'',dy:'',dt:'',tm:'',el:'',rm:[],done:false,st:'Scheduled'});save();render()},
use:i=>{S.groups[i].th=S.themes[i].t;save();toast('Theme updated')},
gen:()=>{$('#prev').textContent=piText();bump();toast('Invitation ready')},
pcopy:()=>copy(pv()),pwa:()=>wa(pv()),psig:()=>sig(pv()),gtr:()=>gt(pv()),gts:()=>gt(invText(cg())),gtp:(i,t)=>{const e=document.querySelector(`[data-p="${t.dataset.pp}"]`),x=e.value.slice(e.selectionStart,e.selectionEnd);gt(x||e.value)},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='group-visit-backup.json';a.click()},
imp:()=>$('#imp').click(),
reset:()=>{if(confirm(T('⚠️ This will erase ALL schedules, notes, themes and settings on this device. This cannot be undone. Export a backup first if unsure. Continue?'))){localStorage.removeItem(K);S=def();render();toast('App reset')}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-go],[data-cur]');if(!t)return;
if(t.dataset.go)return go(t.dataset.go);
if(t.dataset.cur!==undefined){S.cur=+t.dataset.cur;save();return render()}
A[t.dataset.a]?.(+t.dataset.i,t)});
const ref=()=>{const s=$('#stats');if(s)s.innerHTML=stats()};
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(p&&e.target.type!='date'&&e.target.tagName!='SELECT'){set(p,e.target.value);ref()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.lang!==undefined)return setLang(t.value);
if(d.ga!==undefined){S.ga[d.ga]=t.value;return save()}
if(d.en!==undefined){t.value?S.en[d.en]=t.value:delete S.en[d.en];return save()}
if(t.id=='gsel'){S.cur=+t.value;save();return render()}
if(d.p){set(d.p,t.value);if(d.p=='mode')mode();
if(t.type=='date'&&/groups\.\d\.dt$/.test(d.p)&&t.value){const g=S.groups[+d.p.split('.')[1]],x=new Date(t.value+'T12:00');g.mo=MO[x.getMonth()];g.dy=DY[x.getDay()];save();render()}else ref()}
if(d.rm){const g=cg(),n=+d.rm;g.rm=t.checked?[...new Set([...g.rm,n])]:g.rm.filter(x=>x!=n);save()}
if(d.fc!==undefined){cg().fc[+d.fc]=t.checked?1:0;save();ref()}
if('done' in d){const g=cg();g.done=t.checked;g.st=t.checked?'Completed':'Scheduled';save();ref()}
if(t.id=='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.groups)||x.groups.length!=6||!Array.isArray(x.themes))throw 0;S=Object.assign(def(),x);save();render();toast('Data imported')}catch(x){toast('That is not a valid Group Visit backup file.')}};r.readAsText(t.files[0]);t.value=''}});
render();
</script></body></html>
